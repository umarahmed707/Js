<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      .container{
         display: flex;
         flex-wrap: wrap;
         justify-content: center;
         align-items: center;
         gap: 20px;
      }
      .card h3,
.card h4,
.card p {
   margin: 2px 0; /* 👈 isko 2px bhi kar sakte ho */
}
.card{
   width: 300px;
   height: 500px;
   box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
   border-radius: 16px;
   padding: 15px;
   gap: 1px;
   text-align: center;

   display: flex;
   flex-direction: column;
   justify-content: space-between; /* 🔥 Important */
}
      .card img{
         width: 100%;
         height: 200px;
         object-fit: contain;
      }
      .btn{
         padding: 10px 20px;
         background-color: #007bff;
         color: white;
         border: none;
         border-radius: 8px;
         cursor: pointer;
         box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
      }
   </style>
</head>
<body>
   <div class="container" id="productContainer"></div>
   <script>
      fetch('https://fakestoreapi.com/products').then(function(response){
         return response.json();
      }).then(function(data){

         let container = document.getElementById("productContainer");
for(let i=0; i<data.length; i++){
   let card =`
   <div class="card">
   <h4>${data[i].category}</h4>
   <img src="${data[i].image}" alt="product image">
   <h3>${data[i].title}</h3>
   <h4>${data[i].price}</h4>
   <p>${data[i].rating.rate} (${data[i].rating.count} reviews)</p>
   <button class="btn">Buy Now</button>
 </div>

   `
   container.innerHTML += card;
}

         console.log(data);
      }).catch(function(error){
         console.log(error);
      })
   
   </script>
</body>
</html>
